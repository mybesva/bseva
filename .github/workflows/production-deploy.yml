name: Production deploy

# main → AWS Production (Mumbai), separate AWS account. Runs only for commits on main, and every run waits for
# approval in the GitHub `production` environment (required reviewers). The OIDC role trusts only that
# environment and can reach only the Production ECR repositories and the Production host. Never runs from develop.
on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "PENDING-new-production-account"
  DOMAIN: app.b-seva.com

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Only main may deploy to Production
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys run from main only (got ${GITHUB_REF})." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/ci
        run: |
          pip install -r requirements.txt pytest==8.3.5 boto3==1.42.64
          # Known pre-existing failure on main (invoice label wording), tracked separately.
          python -m pytest -q -p no:cacheprovider \
            --deselect tests/test_final_booking_requirements.py::test_invoice_html_renders_snapshot_duration_dynamically
      - name: Infra CLI compiles
        run: python -m py_compile infra/aws/bseva_qa.py
      - name: Host scripts (shellcheck)
        run: shellcheck -S warning deploy/host/*.sh deploy/nginx/40-bseva-config.sh

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/bseva-production-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API image (arm64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build --platform linux/arm64 -f deploy/docker/api.Dockerfile \
            --build-arg APP_VERSION="$TAG" -t "$REGISTRY/bseva-api:$TAG" --push .
      - name: Build web image (arm64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build --platform linux/arm64 -f deploy/docker/web.Dockerfile --load \
            --build-arg VITE_ADMIN_PATH="${{ vars.VITE_ADMIN_PATH || '/bseva-ops-m8k4q' }}" \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${{ vars.VITE_GOOGLE_MAPS_API_KEY }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ vars.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_VAPID_KEY="${{ vars.VITE_FIREBASE_VAPID_KEY }}" \
            -t "$REGISTRY/bseva-web:$TAG" .
      - name: Validate Nginx configuration
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-web:${{ steps.meta.outputs.tag }}
        run: docker run --rm --add-host api:127.0.0.1 -e DOMAIN="$DOMAIN" "$IMAGE" nginx -t
      - name: Smoke-test API image (imports, gunicorn config)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-api:${{ steps.meta.outputs.tag }}
        run: |
          docker pull --quiet "$IMAGE"
          docker run --rm -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci -e ENVIRONMENT=development \
            "$IMAGE" python -c "import app.main, app.worker, app.db_bootstrap, weasyprint; print('ok')"
      - name: Push web image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-web:${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/bseva-production-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy on the Production host via SSM (health-gated, auto-rollback)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REGISTRY: ${{ needs.build.outputs.registry }}
          DEPLOY_ENV: production
        run: python3 deploy/ci/ssm_deploy.py
      - name: Public health check
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          body="$(curl -fsS --max-time 15 "https://${DOMAIN}/api/ready")"
          echo "$body"
          echo "$body" | jq -e --arg v "$TAG" '.ok == true and .version == $v'
          echo "### Production deployed: \`$TAG\` (${GITHUB_SHA}) by ${GITHUB_ACTOR}" >> "$GITHUB_STEP_SUMMARY"
