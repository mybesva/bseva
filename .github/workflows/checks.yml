name: Checks

# Shared quality gate: PR CI (ci.yml), QA deploy and Production deploy all run exactly these jobs, so a commit
# that passed review is held to the same bar before every deployment.
on:
  workflow_call:
    inputs:
      migration_base:
        description: Ref the migration policy compares against (empty skips the policy, e.g. on develop pushes).
        type: string
        default: ""
      build_images:
        description: Build both Docker images (no push) to prove the Dockerfiles still work.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/ci
          # Deployments must not change existing data: tests/test_ensure_schema_data_integrity.py
          BSEVA_TEST_PG_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
          REQUIRE_PG_TESTS: "1"
        run: |
          pip install -r requirements.txt pytest==8.3.5 boto3==1.42.64
          # Known pre-existing failure on main (invoice label wording), tracked separately.
          python -m pytest -q -p no:cacheprovider \
            --deselect tests/test_final_booking_requirements.py::test_invoice_html_renders_snapshot_duration_dynamically

  migrations:
    name: Migrations (PostgreSQL 17)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bseva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/bseva
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migration policy (immutable history, backward-compatible new files)
        if: inputs.migration_base != ''
        run: |
          git fetch --no-tags origin "${{ inputs.migration_base }}"
          python3 deploy/ci/check_migrations.py "origin/${{ inputs.migration_base }}"
      - name: Fresh database — every file, then strict ensure_schema
        working-directory: backend
        run: |
          REQUIRE_TARGET_GUARD=1 EXPECTED_DB_HOST_PREFIX=127.0.0.1 EXPECTED_ENVIRONMENT=development \
            python -m app.db_bootstrap
      - name: Re-run is a no-op
        working-directory: backend
        run: |
          python -m app.db_bootstrap | tee /tmp/rerun.log
          grep -q '"applied_now": 0' /tmp/rerun.log
      - name: Target guard refuses the wrong database
        working-directory: backend
        run: |
          set +e
          REQUIRE_TARGET_GUARD=1 EXPECTED_DB_HOST_PREFIX=bseva-prod-db. EXPECTED_ENVIRONMENT=production python -m app.db_bootstrap
          test $? -eq 3
      - name: A failing migration stops the deploy and leaves nothing behind
        working-directory: backend
        run: |
          dir="$(mktemp -d)"; cp ../supabase/migrations/*.sql "$dir/"
          printf 'CREATE TABLE ci_probe(x int);\nSELECT * FROM ci_missing_table;\n' > "$dir/999_ci_failure.sql"
          set +e; MIGRATIONS_DIR="$dir" python -m app.db_bootstrap; rc=$?; set -e
          test "$rc" -eq 1
          python - <<'EOF'
          import app.db_bootstrap as b
          with b._connect() as c:
              assert c.execute("SELECT to_regclass('public.ci_probe')").fetchone()[0] is None, "partial migration left behind"
              assert not c.execute("SELECT 1 FROM schema_migrations WHERE filename = '999_ci_failure.sql'").fetchone()
          print("rolled back cleanly")
          EOF

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Host scripts (shellcheck)
        run: shellcheck -S warning deploy/host/*.sh deploy/nginx/40-bseva-config.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tooling compiles
        run: python3 -m py_compile infra/aws/bseva_qa.py deploy/ci/*.py && pip install --quiet boto3==1.42.64
      - name: Production domain guard
        run: |
          set +e
          out="$(DEPLOY_ENV=production TAG=sha-0 REGISTRY=x DOMAIN=app.b-seva.com python3 deploy/ci/ssm_deploy.py 2>&1)"; rc=$?
          set -e
          echo "$out"; test "$rc" -ne 0 && grep -q "production expects DOMAIN=b-seva.com" <<<"$out"

  images:
    name: Docker images build
    if: inputs.build_images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        run: docker buildx build -f deploy/docker/api.Dockerfile --build-arg APP_VERSION=ci -t bseva-api:ci --load .
      - name: Web image + Nginx config
        run: |
          docker buildx build -f deploy/docker/web.Dockerfile -t bseva-web:ci --load .
          docker run --rm --add-host api:127.0.0.1 -e DOMAIN=b-seva.com -e EXTRA_DOMAINS="www.b-seva.com app.b-seva.com" bseva-web:ci nginx -t
      - name: API image imports
        run: |
          docker run --rm -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci -e ENVIRONMENT=development \
            bseva-api:ci python -c "import app.main, app.worker, app.db_bootstrap, weasyprint; print('ok')"
