name: QA deploy

# develop → AWS QA (Mumbai), automatically on every push/merge: checks (tests, migration tests, static) → arm64
# images → migrations on the QA database (target-guarded, fail-fast) → deploy → health checks, with automatic
# rollback of the application if health checks fail. Never deploys Production: the OIDC role only trusts the
# `qa` environment (develop only), and its permissions are limited to the QA ECR repositories and the QA host.
# A successful run of this workflow is what qualifies a commit for Production (deploy/ci/qa_gate.py).
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: qa-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "472238087252"
  QA_DOMAIN: qa.b-seva.com

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04-arm
    environment: qa
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/bseva-qa-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      # ECR tags are immutable and the tag is derived from this commit, so an image already stored under it was
      # built from this exact commit. Re-running the workflow (e.g. to load changed SSM settings) reuses it instead
      # of failing to push the same tag again. Any lookup error other than "not found" fails the job.
      - name: Find images already built for this commit
        id: existing
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          digest() {
            local out
            if out="$(aws ecr describe-images --repository-name "$1" --image-ids imageTag="$TAG" \
                --query 'imageDetails[0].imageDigest' --output text 2>&1)"; then
              echo "$out"
            elif grep -q ImageNotFoundException <<<"$out"; then
              echo none
            else
              echo "$out" >&2
              return 1
            fi
          }
          api="$(digest bseva-api)"
          web="$(digest bseva-web)"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "bseva-api:$TAG ${api/none/not built yet}; bseva-web:$TAG ${web/none/not built yet}"
          if [ "$api" != none ] || [ "$web" != none ]; then
            echo "Reusing images already built for \`$TAG\`: api \`$api\`, web \`$web\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and push API image (arm64)
        if: steps.existing.outputs.api == 'none'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build --platform linux/arm64 -f deploy/docker/api.Dockerfile \
            --build-arg APP_VERSION="$TAG" -t "$REGISTRY/bseva-api:$TAG" --push .
      - name: Build web image (arm64)
        if: steps.existing.outputs.web == 'none'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build --platform linux/arm64 -f deploy/docker/web.Dockerfile --load \
            --build-arg VITE_ADMIN_PATH="${{ vars.VITE_ADMIN_PATH || '/bseva-ops-m8k4q' }}" \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${{ vars.VITE_GOOGLE_MAPS_API_KEY }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ vars.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_VAPID_KEY="${{ vars.VITE_FIREBASE_VAPID_KEY }}" \
            -t "$REGISTRY/bseva-web:$TAG" .
      - name: Pull reused web image and verify its digest
        if: steps.existing.outputs.web != 'none'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-web:${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.existing.outputs.web }}
        run: |
          docker pull --quiet "$IMAGE"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$IMAGE" | grep -qx "${IMAGE%:*}@$DIGEST"
      - name: Validate Nginx configuration
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-web:${{ steps.meta.outputs.tag }}
        run: docker run --rm --add-host api:127.0.0.1 -e DOMAIN="$QA_DOMAIN" "$IMAGE" nginx -t
      - name: Smoke-test API image (imports, gunicorn config)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-api:${{ steps.meta.outputs.tag }}
        run: |
          docker pull --quiet "$IMAGE"
          docker run --rm -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci -e ENVIRONMENT=development \
            "$IMAGE" python -c "import app.main, app.worker, app.db_bootstrap, weasyprint; print('ok')"
      - name: Verify reused API image belongs to this commit
        if: steps.existing.outputs.api != 'none'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-api:${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.existing.outputs.api }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$IMAGE" | grep -qx "${IMAGE%:*}@$DIGEST"
          test "$(docker run --rm "$IMAGE" printenv APP_VERSION)" = "$TAG"
      - name: Push web image
        if: steps.existing.outputs.web == 'none'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/bseva-web:${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: qa
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/bseva-qa-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Migrate + deploy on the QA host via SSM (health-gated, auto-rollback)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REGISTRY: ${{ needs.build.outputs.registry }}
        run: python3 deploy/ci/ssm_deploy.py
      - name: Public health check
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          body="$(curl -fsS --max-time 15 "https://${QA_DOMAIN}/api/ready")"
          echo "$body"
          echo "$body" | jq -e --arg v "$TAG" '.ok == true and .version == $v'
          echo "### QA deployed: \`$TAG\` (${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
