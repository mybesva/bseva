<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>B-SEVA Company Signboard</title>
<!-- Artboard: 24in x 12in. 1in = 100 CSS px (2400 x 1200). Exported at 3x = 7200 x 3600 px (300 DPI). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@500;600;700&display=block" rel="stylesheet" />
<style>
  @page { size: 24in 12in; margin: 0; }
  :root {
    --ivory: #FBF6EC;
    --ivory-deep: #F4EADA;
    --saffron: #E86000;
    --saffron-bright: #F07800;
    --saffron-ink: #B84A00;
    --navy: #0B2A4D;
    --ink: #121A26;
    --gold: #C9A24A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2400px; height: 1200px; background: var(--ivory); }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .board {
    position: relative; width: 2400px; height: 1200px; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 80% at 18% 50%, #FFFDF8 0%, rgba(255,253,248,0) 70%),
      linear-gradient(180deg, var(--ivory) 0%, var(--ivory-deep) 100%);
  }

  /* Faint temple-geometry mandala, far right, behind nothing important */
  .mandala { position: absolute; right: -330px; top: 50%; width: 1020px; height: 1020px; transform: translateY(-50%); opacity: 0.075; }

  /* Frame: saffron outer rule + fine inner rule, 0.4in in from the trim */
  .frame { position: absolute; inset: 40px; border: 4px solid var(--saffron); border-radius: 6px; }
  .frame::after { content: ""; position: absolute; inset: 10px; border: 1.5px solid rgba(201,162,74,0.75); border-radius: 3px; }
  /* small corner diamonds on the inner rule */
  .corner { position: absolute; width: 16px; height: 16px; background: var(--saffron); transform: rotate(45deg); }
  .c-tl { left: 44px; top: 44px; } .c-tr { right: 44px; top: 44px; }
  .c-bl { left: 44px; bottom: 44px; } .c-br { right: 44px; bottom: 44px; }

  .content { position: absolute; inset: 110px 130px 110px 120px; display: flex; align-items: center; }

  .logo-col { width: 560px; height: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-col img { height: 820px; width: auto; display: block; }

  .divider { width: 6px; height: 760px; margin: 0 90px 0 70px; flex-shrink: 0; border-radius: 3px;
    background: linear-gradient(180deg, rgba(232,96,0,0) 0%, var(--saffron) 18%, var(--saffron-bright) 50%, var(--saffron) 82%, rgba(232,96,0,0) 100%); }

  .info { flex: 1; min-width: 0; }
  .name {
    font-family: "Montserrat", "Arial Black", sans-serif; font-weight: 800; color: var(--navy);
    font-size: 100px; line-height: 1.02; letter-spacing: 0.005em; white-space: nowrap;
  }
  .rule { display: flex; align-items: center; gap: 18px; margin: 40px 0 42px; }
  .rule .bar { width: 170px; height: 8px; border-radius: 4px; background: var(--saffron); }
  .rule .dot { width: 14px; height: 14px; background: var(--gold); transform: rotate(45deg); }
  .rule .line { flex: 1; height: 2px; background: linear-gradient(90deg, rgba(201,162,74,0.85), rgba(201,162,74,0)); }

  .cin { font-family: "Inter", Arial, sans-serif; font-weight: 700; font-size: 54px; color: var(--ink); letter-spacing: 0.035em; }
  .cin .label { color: var(--saffron-ink); }

  .sep { height: 2px; margin: 50px 0 46px; background: linear-gradient(90deg, rgba(232,96,0,0.55), rgba(232,96,0,0.08)); }

  .ro-label { font-family: "Inter", Arial, sans-serif; font-weight: 700; font-size: 38px; color: var(--saffron-ink); letter-spacing: 0.02em; margin-bottom: 18px; }
  .address { font-family: "Inter", Arial, sans-serif; font-weight: 600; font-size: 40px; line-height: 1.55; color: var(--ink); white-space: nowrap; }
</style>
</head>
<body>
  <div class="board">
    <svg class="mandala" viewBox="-100 -100 200 200" aria-hidden="true">
      <g fill="none" stroke="#B8862B" stroke-width="0.6">
        <circle r="96" /><circle r="90" /><circle r="70" /><circle r="46" /><circle r="22" /><circle r="8" />
        <g id="petals">
          <path d="M0 -90 C 12 -78, 12 -60, 0 -46 C -12 -60, -12 -78, 0 -90 Z" />
          <path d="M0 -70 C 8 -60, 8 -50, 0 -22 C -8 -50, -8 -60, 0 -70 Z" />
        </g>
        <use href="#petals" transform="rotate(22.5)" /><use href="#petals" transform="rotate(45)" /><use href="#petals" transform="rotate(67.5)" />
        <use href="#petals" transform="rotate(90)" /><use href="#petals" transform="rotate(112.5)" /><use href="#petals" transform="rotate(135)" />
        <use href="#petals" transform="rotate(157.5)" /><use href="#petals" transform="rotate(180)" /><use href="#petals" transform="rotate(202.5)" />
        <use href="#petals" transform="rotate(225)" /><use href="#petals" transform="rotate(247.5)" /><use href="#petals" transform="rotate(270)" />
        <use href="#petals" transform="rotate(292.5)" /><use href="#petals" transform="rotate(315)" /><use href="#petals" transform="rotate(337.5)" />
        <rect x="-64" y="-64" width="128" height="128" /><rect x="-64" y="-64" width="128" height="128" transform="rotate(45)" />
      </g>
    </svg>

    <div class="frame"></div>
    <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>

    <div class="content">
      <div class="logo-col"><img src="bseva-logo.png" alt="B-SEVA logo" /></div>
      <div class="divider"></div>
      <div class="info">
        <h1 class="name">B-SEVA PRIVATE LIMITED</h1>
        <div class="rule"><span class="bar"></span><span class="dot"></span><span class="line"></span></div>
        <p class="cin"><span class="label">CIN:</span> U47735TS2026PTC224181</p>
        <div class="sep"></div>
        <p class="ro-label">Registered Office:</p>
        <p class="address">DIVYASREE HOLDINGS PVTLTD, PNO5&amp;43, HITECCITY LAYOUT,<br />Madhapur, Shaikpet, Hyderabad – 500081, Telangana</p>
      </div>
    </div>
  </div>
</body>
</html>
