# Render Blueprint — connect this repo and deploy as a Web Service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bseva
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
