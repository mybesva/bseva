# B-Seva (QA or Production, per ENV_NAME) on a single EC2 host. Driven by deploy/host/deploy.sh; values come from /opt/bseva/.env:
#   REGISTRY (ECR registry host), IMAGE_TAG (sha-<git sha>), DOMAIN, AWS_REGION
# App configuration and secrets are rendered from SSM Parameter Store into /opt/bseva/env/app.env.
name: bseva-${ENV_NAME:-qa}

x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-ap-south-1}
    awslogs-group: /bseva/${ENV_NAME:-qa}/app
    tag: "{{.Name}}"

x-app: &app
  image: ${REGISTRY}/bseva-api:${IMAGE_TAG}
  env_file: /opt/bseva/env/app.env
  environment:
    APP_VERSION: ${IMAGE_TAG}
    DB_POOL: queue
    DB_SSLMODE: verify-full
    DB_SSLROOTCERT: /etc/ssl/rds/rds-ca.pem
  volumes:
    - /opt/bseva/secrets:/run/bseva-secrets:ro
  restart: unless-stopped
  logging: *logging

services:
  api:
    <<: *app
    environment:
      APP_VERSION: ${IMAGE_TAG}
      DB_POOL: queue
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /etc/ssl/rds/rds-ca.pem
      GUNICORN_WORKERS: "2"
    mem_limit: 750m
    stop_grace_period: 35s
    expose: ["8000"]

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      APP_VERSION: ${IMAGE_TAG}
      DB_POOL: queue
      DB_POOL_SIZE: "2"
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /etc/ssl/rds/rds-ca.pem
    mem_limit: 450m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat')<180 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3

  web:
    image: ${REGISTRY}/bseva-web:${IMAGE_TAG}
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - /opt/bseva/letsencrypt:/etc/letsencrypt:ro
      - /opt/bseva/certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 96m
    restart: unless-stopped
    logging: *logging

  certbot:
    image: certbot/certbot:v3.3.0
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - /opt/bseva/letsencrypt:/etc/letsencrypt
      - /opt/bseva/certbot-www:/var/www/certbot
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # One-off tasks (not started by `up`): docker compose run --rm migrate
  migrate:
    <<: *app
    command: ["python", "-m", "app.db_bootstrap"]
    restart: "no"
    profiles: ["tools"]
